<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الثعبان المطور</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 2.5rem;
            color: #4CAF50;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        #hint-text {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 15px;
            height: 20px;
        }

        #score-board {
            font-size: 1.5rem;
            margin-bottom: 15px;
            background: #2d2d2d;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #444;
        }

        #game-container {
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            background-color: #111;
            display: block;
            border: 4px solid #4CAF50;
            border-radius: 6px;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ff4d4d;
            border-radius: 6px;
            z-index: 10;
        }

        #game-over-screen h2 {
            font-size: 3rem;
            margin: 0 0 10px 0;
        }

        #game-over-screen p {
            color: #fff;
            font-size: 1.2rem;
            margin: 0 0 20px 0;
        }

        #restart-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.2s;
        }

        #restart-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>لعبة الثعبان</h1>
    <div id="hint-text">اضغط على أي سهم لبدء التحرك واللعب...</div>
    <div id="score-board">النتيجة: <span id="score">0</span></div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="game-over-screen">
            <h2>لقد خسرت!</h2>
            <p>اصطدمت بالحائط أو بجسمك.</p>
            <button id="restart-btn" onclick="resetGame()">اللعب مجدداً</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const gameOverScreen = document.getElementById("game-over-screen");
        const hintText = document.getElementById("hint-text");

        const boxSize = 20; 
        
        let snake, d, food, score, gameInterval;
        let changeDirectionQueue = []; 
        let isGameRunning = false; // متغير منطقي للتحكم في حالة بداية اللعبة

        // تجهيز اللعبة في وضع الانتظار لأول مرة
        initGame();

        // دالة إعداد الحالة الابتدائية الثابتة للعبة
        function initGame() {
            snake = [
                {x: 9 * boxSize, y: 10 * boxSize},
                {x: 8 * boxSize, y: 10 * boxSize},
                {x: 7 * boxSize, y: 10 * boxSize}
            ];
            
            d = ""; // لا يوجد اتجاه مبدئي ليبقى الثعبان ثابتاً
            score = 0;
            scoreElement.innerText = score;
            changeDirectionQueue = [];
            isGameRunning = false;
            hintText.innerText = "اضغط على أي سهم لبدء التحرك واللعب...";
            gameOverScreen.style.display = "none";
            
            generateFood();
            drawGameFrame(); // رسم الإطار الأول الثابت للثعبان والطعام
        }

        // دالة إعادة التشغيل بعد الخسارة تضع اللعبة في وضع الانتظار أيضاً
        function resetGame() {
            if (gameInterval) clearInterval(gameInterval);
            initGame();
        }

        // توليد طعام في مكان عشوائي نظيف
        function generateFood() {
            let validLocation = false;
            while (!validLocation) {
                food = {
                    x: Math.floor(Math.random() * (canvas.width / boxSize)) * boxSize,
                    y: Math.floor(Math.random() * (canvas.height / boxSize)) * boxSize
                };
                validLocation = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        // الاستماع لمدخلات لوحة المفاتيح
        document.addEventListener("keydown", direction);

        function direction(event) {
            let key = event.keyCode;
            
            // قراءة الاتجاه الحالي بدقة من الطابور
            let currentDir = changeDirectionQueue.length > 0 ? changeDirectionQueue[changeDirectionQueue.length - 1] : d;

            // إذا كانت اللعبة في وضع الانتظار وضغط المستخدم سهم توجيه valid
            if (!isGameRunning && (key === 37 || key === 38 || key === 39 || key === 40)) {
                // منع التحرك للخلف فوراً عند البداية (لأن الثعبان ممدد لليمين، فلا يجوز البدء لليسار)
                if (key === 37) return; 

                isGameRunning = true;
                hintText.innerText = "[]! ركز جيداً.";
                
                // تشغيل المؤقت الزمني بانتظام لتحديث الإطارات
                gameInterval = setInterval(update, 100); 
            }

            // إدارة الأسهم ومنع الحركة الانتحارية العكسية أثناء اللعب
            if (key === 37 && currentDir !== "RIGHT") changeDirectionQueue.push("LEFT");
            else if (key === 38 && currentDir !== "DOWN") changeDirectionQueue.push("UP");
            else if (key === 39 && currentDir !== "LEFT") changeDirectionQueue.push("RIGHT");
            else if (key === 40 && currentDir !== "UP") changeDirectionQueue.push("DOWN");
        }

        function checkCollision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x === array[i].x && head.y === array[i].y) {
                    return true;
                }
            }
            return false;
        }

        // دالة الرسم الأساسية المشتركة
        function drawGameFrame() {
            // تنظيف مساحة الرسم
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // رسم الثعبان
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i === 0) ? "#4CAF50" : "#81C784";
                ctx.fillRect(snake[i].x, snake[i].y, boxSize, boxSize);
                ctx.strokeStyle = "#111";
                ctx.strokeRect(snake[i].x, snake[i].y, boxSize, boxSize);
            }

            // رسم الطعام
            ctx.fillStyle = "#FF5722";
            ctx.beginPath();
            ctx.arc(food.x + boxSize/2, food.y + boxSize/2, boxSize/2 - 2, 0, 2 * Math.PI);
            ctx.fill();
        }

        // الدالة المسؤولة عن تحديث منطق الحركة (المحرك)
        function update() {
            if (changeDirectionQueue.length > 0) {
                d = changeDirectionQueue.shift();
            }

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (d === "LEFT") snakeX -= boxSize;
            if (d === "UP") snakeY -= boxSize;
            if (d === "RIGHT") snakeX += boxSize;
            if (d === "DOWN") snakeY += boxSize;

            let newHead = { x: snakeX, y: snakeY };

            // فحص شروط الخسارة
            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || checkCollision(newHead, snake)) {
                clearInterval(gameInterval);
                gameOverScreen.style.display = "flex";
                hintText.innerText = "انتهت اللعبة!";
                return;
            }

            // منطق الأكل والنمو
            if (snakeX === food.x && snakeY === food.y) {
                score++;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }

            snake.unshift(newHead);
            
            // إعادة رسم الكوادر بعد التحديث
            drawGameFrame();
        }
    </script>
</body>
</html>
